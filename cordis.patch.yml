# 本包只插一条：宿主半边（index.js）注册 /howtolivebetter/api/* 的只读 JSON 路由，
# 客户端半边（client.js）往侧栏加一个图标、往主面板加一个阅读页。
#
# 这里写包名而不是 file URL：装到 profile 的 node_modules 后，包名就是
# client.js 里 window.__ModuleLoader__.load({ id: 'dsh-howtolivebetter' }) 的同一把钥匙。
# 本地开发用 file URL 更稳（Host 按 specifier 缓存「是不是客户端包」，新键能绕过旧判断），
# 发布版按包名走。
- insert:
    - id: howtolivebetter
      name: 'dsh-howtolivebetter'
